<!DOCTYPE html>
<html>

<head>

<title>Login - YSCMT Community</title>

<link rel="stylesheet" href="/static/css/style.css">

</head>


<body>


<section class="hero">


<div class="card">

<h1>
Student Login
</h1>


<form method="POST">

{% csrf_token %}


<input 
type="text"
name="username"
placeholder="Username"
required>


<input
type="password"
name="password"
placeholder="Password"
required>


<button>
Login
</button>


</form>


<p>
Don't have an account?
<a href="/accounts/register/">
Register
</a>
</p>


</div>


</section>


</body>

</html>
