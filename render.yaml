services:
  - type: web
    name: yscmt-backend-v2
    runtime: docker
    repo: https://github.com/hackeryoung34-netizen/yscmt-backend
    branch: render-v2-setup
    plan: free
    region: frankfurt
    dockerContext: yscmt
    dockerfilePath: yscmt/Dockerfile
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: yscmt-backend-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"

databases:
  - name: yscmt-backend-db
    databaseName: yscmt
    user: yscmt
    plan: free
    region: frankfurt
    postgresMajorVersion: "18"
