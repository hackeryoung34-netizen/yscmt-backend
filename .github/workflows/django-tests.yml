name: Django backend checks

on:
  push:
    branches:
      - render-v2-setup
  pull_request:
    branches:
      - render-v2-setup

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yscmt
    env:
      DEBUG: "True"
      SECRET_KEY: "ci-only-test-secret-key-not-for-production"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: yscmt/requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Django system check
        run: python manage.py check

      - name: Run tests
        run: python manage.py test --verbosity 2
