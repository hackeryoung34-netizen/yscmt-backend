name: Portal API tests

on:
  pull_request:
    branches: [main, migration/independent-portal]
    paths:
      - "yscmt/**"
      - ".github/workflows/portal-api-tests.yml"
  push:
    branches: [migration/independent-portal]
    paths:
      - "yscmt/**"
      - ".github/workflows/portal-api-tests.yml"

permissions:
  contents: read

jobs:
  django-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: yscmt
    env:
      SECRET_KEY: ci-only-not-a-production-secret
      DEBUG: "False"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: yscmt/requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run portal API tests
        run: python manage.py test accounts.test_portal_auth --verbosity 2
